apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-test-dev-dev
  namespace: dev
  labels:
    app: deploy-test-dev-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-test-dev-dev
  template:
    metadata:
      labels:
        app: deploy-test-dev-dev
    spec:
      containers:
        - name: deploy-test-dev-dev
          # image: harbor.ldc.opstree.dev/library/ot-test:${BP_IMAGE_TAG}
          image: ${BP_REG_CRED}:${BP_IMAGE_TAG}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "50Mi"
            limits:
              cpu: "500m"
              memory: "500Mi"
